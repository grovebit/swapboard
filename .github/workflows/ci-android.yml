# Android app: unit tests (including the shared protocol vectors), lint and a debug build.
name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'protocol/**', 'VERSION', '.github/workflows/ci-android.yml']
  pull_request:
    paths: ['android/**', 'protocol/**', 'VERSION', '.github/workflows/ci-android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Test, lint and build
        working-directory: android
        run: ./gradlew --no-daemon test lintDebug assembleDebug
